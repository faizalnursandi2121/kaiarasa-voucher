<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <link rel="icon" href="favicon.ico">

    <title>Kaiarasa — Logged Out</title>

    <meta http-equiv="refresh" content="8; url=$(link-login)">

    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/main.js"></script>

    <style>
        /* Self-hosted Inter (latin, variable font) — captive portal
           has no internet access, so Google Fonts cannot be used */
        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url("assets/fonts/inter-latin.woff2") format("woff2");
        }

        :root {
            --sage: #92aa96;
            --sage-deep: #5f7f67;

            --card-bg: rgba(250, 250, 247, 0.96);
            --card-border: rgba(28, 36, 32, 0.08);

            --card-ink: #1c2420;
            --card-ink-88: rgba(28, 36, 32, 0.88);
            --card-ink-65: rgba(28, 36, 32, 0.65);
            --card-ink-52: rgba(28, 36, 32, 0.52);
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #121613;
            color: var(--card-ink);
            overflow: hidden;
        }

        button, a { font: inherit; }

        /* =========================================================
           PORTAL + BACKGROUND (static, same pattern as alogin)
        ========================================================= */

        .portal {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            isolation: isolate;
        }

        .background {
            position: absolute;
            inset: 0;
            z-index: -10;
            background: url('assets/img/bg-1.webp') center / cover no-repeat #151a16;
            animation: bg-in 1s ease both;
        }

        .background-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 10, 0.55);
        }

        @keyframes bg-in {
            from { opacity: 0; transform: scale(1.03); }
            to { opacity: 1; transform: scale(1); }
        }

        /* =========================================================
           CARD
        ========================================================= */

        .logout-card {
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: var(--card-bg);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.14);
            text-align: center;
            animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            display: block;
            width: auto;
            height: 44px;
            margin: 0 auto 20px;
            object-fit: contain;
        }

        .badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(146, 170, 150, 0.14);
            border: 1px solid rgba(95, 127, 103, 0.30);
            color: var(--sage-deep);
            animation: badge-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        @keyframes badge-pop {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--card-ink);
        }

        .desc {
            margin: 0;
            color: var(--card-ink-65);
            font-size: 13px;
            line-height: 1.6;
        }

        /* Session summary */
        .summary {
            margin-top: 22px;
            text-align: left;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 13px;
            background: rgba(28, 36, 32, 0.04);
            border: 1px solid rgba(28, 36, 32, 0.06);
        }

        .row .k {
            color: var(--card-ink-65);
            font-size: 12px;
            font-weight: 500;
        }

        .row .v {
            color: var(--card-ink);
            font-size: 13px;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .stat {
            padding: 14px;
            border-radius: 13px;
            background: rgba(28, 36, 32, 0.04);
            border: 1px solid rgba(28, 36, 32, 0.06);
            text-align: left;
        }

        .stat .label {
            margin-bottom: 8px;
            color: var(--card-ink-65);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat .value {
            color: var(--card-ink);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        /* Actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 22px;
        }

        .btn-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 13px;
            background: var(--sage-deep);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .btn-login:hover {
            background: #6d8f75;
            transform: translateY(-1px);
        }

        .redirect-note {
            margin: 16px 0 0;
            color: var(--card-ink-52);
            font-size: 11px;
        }

        .redirect-note a {
            color: var(--sage-deep);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid rgba(95, 127, 103, 0.35);
        }

        @media (max-width: 480px) {
            .logout-card { padding: 28px 22px; border-radius: 17px; }
            .logo { height: 38px; margin-bottom: 16px; }
        }
    </style>
</head>

<body>

<div class="portal">
    <div class="background">
        <div class="background-overlay"></div>
    </div>

    <div class="logout-card">
        <img class="logo" src="assets/img/logo-sage.webp" alt="Kaiarasa">

        <div class="badge">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </div>

        <h1>Logged Out</h1>

        <p class="desc">
            You have been disconnected from the Kaiarasa hotspot. See you again soon.
        </p>

        <!-- Session summary -->
        <div class="summary">
            <div class="row">
                <span class="k">User</span>
                <span class="v">$(username)</span>
            </div>
            <div class="stats">
                <div class="stat">
                    <p class="label">Total Uptime</p>
                    <p class="value" id="uptime-value">$(uptime)</p>
                </div>
                <div class="stat">
                    <p class="label">Data Used</p>
                    <p class="value">$(bytes-total-nice)</p>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <a href="$(link-login)" class="btn-login">
                Login Again
            </a>
        </div>

        <p class="redirect-note">
            Redirecting to login automatically… <a href="$(link-login)">Go now</a>
        </p>
    </div>
</div>

<script>
    // Prettify uptime: "1h2m3s" -> "1 Hour 2 Minutes 3 Seconds"
    (function () {
        var el = document.getElementById('uptime-value');
        if (el && window.formatTime) {
            var pretty = window.formatTime(el.textContent.trim());
            if (pretty && pretty !== '-') el.textContent = pretty;
        }
    })();
</script>
</body>
</html>
