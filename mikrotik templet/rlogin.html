<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <link rel="icon" href="favicon.ico">

    <title>Kaiarasa — Login Required</title>

    <link rel="stylesheet" href="assets/css/styles.css">

    <style>
        /* Self-hosted Inter (latin, variable font) */
        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url("assets/fonts/inter-latin.woff2") format("woff2");
        }

        :root {
            --sage-deep: #5f7f67;
            --card-bg: rgba(250, 250, 247, 0.96);
            --card-border: rgba(28, 36, 32, 0.08);
            --card-ink: #1c2420;
            --card-ink-75: rgba(28, 36, 32, 0.75);
            --card-ink-52: rgba(28, 36, 32, 0.52);
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #121613;
            color: var(--card-ink);
            overflow: hidden;
        }

        .portal {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            isolation: isolate;
        }

        .background {
            position: absolute;
            inset: 0;
            z-index: -10;
            background: url('assets/img/bg-1.webp') center / cover no-repeat #151a16;
            animation: bg-in 1s ease both;
        }

        .background-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 10, 0.55);
        }

        @keyframes bg-in {
            from { opacity: 0; transform: scale(1.03); }
            to { opacity: 1; transform: scale(1); }
        }

        .r-card {
            width: 100%;
            max-width: 380px;
            padding: 36px 32px;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: var(--card-bg);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.14);
            text-align: center;
            animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(217, 119, 6, 0.10);
            border: 1px solid rgba(217, 119, 6, 0.28);
            color: #d97706;
            animation: badge-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both;
        }

        @keyframes badge-pop {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--card-ink);
        }

        .desc {
            margin: 0;
            color: var(--card-ink-75);
            font-size: 13px;
            line-height: 1.6;
        }

        .spinner {
            width: 22px;
            height: 22px;
            margin: 22px auto 0;
            border-radius: 999px;
            border: 2px solid rgba(28, 36, 32, 0.12);
            border-top-color: var(--sage-deep);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .fallback {
            margin: 18px 0 0;
            color: var(--card-ink-52);
            font-size: 11px;
        }

        .fallback a {
            color: var(--sage-deep);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid rgba(95, 127, 103, 0.35);
        }
    </style>
</head>

<body>

<div class="portal">
    <div class="background">
        <div class="background-overlay"></div>
    </div>

    <div class="r-card">
        <div class="badge">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>

        <h1>Login Required</h1>

        <p class="desc">
            You need to sign in first. Redirecting you to the login page…
        </p>

        <div class="spinner"></div>

        <p class="fallback">
            Not redirected? <a href="$(link-redirect)">Click here</a>
        </p>
    </div>
</div>

<!-- Redirect Logic -->
$(if http-header == "Location")$(link-redirect)$(endif)
<meta http-equiv="refresh" content="2; url=$(link-redirect)">
<script>
    setTimeout(function() {
        window.location.href = '$(link-redirect)';
    }, 2000);
</script>
</body>
</html>
