<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <link rel="icon" href="favicon.ico">

    <title>Kaiarasa — Connection Error</title>

    <link rel="stylesheet" href="assets/css/styles.css">

    <style>
        /* Self-hosted Inter (latin, variable font) — captive portal
           has no internet access, so Google Fonts cannot be used */
        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url("assets/fonts/inter-latin.woff2") format("woff2");
        }

        :root {
            --sage: #92aa96;
            --sage-deep: #5f7f67;

            --card-bg: rgba(250, 250, 247, 0.96);
            --card-border: rgba(28, 36, 32, 0.08);

            --card-ink: #1c2420;
            --card-ink-65: rgba(28, 36, 32, 0.65);
            --card-ink-52: rgba(28, 36, 32, 0.52);
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #121613;
            color: var(--card-ink);
            overflow: hidden;
        }

        button, a { font: inherit; }

        /* =========================================================
           PORTAL + BACKGROUND (static, same pattern as alogin/logout)
        ========================================================= */

        .portal {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            isolation: isolate;
        }

        .background {
            position: absolute;
            inset: 0;
            z-index: -10;
            background: url('assets/img/bg-1.webp') center / cover no-repeat #151a16;
            animation: bg-in 1s ease both;
        }

        .background-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 10, 0.55);
        }

        @keyframes bg-in {
            from { opacity: 0; transform: scale(1.03); }
            to { opacity: 1; transform: scale(1); }
        }

        /* =========================================================
           CARD
        ========================================================= */

        .error-card {
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: var(--card-bg);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.14);
            text-align: center;
            animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            display: block;
            width: auto;
            height: 44px;
            margin: 0 auto 20px;
            object-fit: contain;
        }

        .badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.24);
            color: #dc2626;
            animation: badge-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        @keyframes badge-pop {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--card-ink);
        }

        .desc {
            margin: 0;
            color: var(--card-ink-65);
            font-size: 13px;
            line-height: 1.6;
        }

        /* Error detail box */
        .error-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 22px;
            padding: 13px 14px;
            border-radius: 13px;
            background: rgba(220, 38, 38, 0.06);
            border: 1px solid rgba(220, 38, 38, 0.18);
            text-align: left;
        }

        .error-box svg {
            flex-shrink: 0;
            margin-top: 1px;
            color: #dc2626;
        }

        .error-box .msg {
            color: #b91c1c;
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1.55;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            word-break: break-word;
        }

        /* Actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 22px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 13px;
            background: var(--sage-deep);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .btn-back:hover {
            background: #6d8f75;
            transform: translateY(-1px);
        }

        .help-note {
            margin: 16px 0 0;
            color: var(--card-ink-52);
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .error-card { padding: 28px 22px; border-radius: 17px; }
            .logo { height: 38px; margin-bottom: 16px; }
        }
    </style>
</head>

<body>

<div class="portal">
    <div class="background">
        <div class="background-overlay"></div>
    </div>

    <div class="error-card">
        <img class="logo" src="assets/img/logo-sage.webp" alt="Kaiarasa">

        <div class="badge">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </div>

        <h1>Connection Error</h1>

        <p class="desc">
            Something went wrong while connecting you to the hotspot. Please try again.
        </p>

        <!-- Router error detail -->
        <div class="error-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span class="msg">$(error)</span>
        </div>

        <!-- Actions -->
        <div class="actions">
            <a href="$(link-login)" class="btn-back">Back to Login</a>
        </div>

        <p class="help-note">
            If this keeps happening, please contact the front desk for assistance.
        </p>
    </div>
</div>

</body>
</html>
