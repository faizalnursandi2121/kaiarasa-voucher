server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Aset statis — cache panjang (cache-busting ?v=filemtime) + kompresi
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 1024;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # SECURITY: uploaded files are static assets only — never execute and
    # never let browsers sniff them into HTML/JS. `^~` takes precedence over
    # the regex PHP handler below, so a planted .php under /uploads/ is
    # denied instead of handed to FastCGI (this was the RCE write target).
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar|pht|cgi|pl|py|sh)$ {
            deny all;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # Deny access to . files
    location ~ /\. {
        deny all;
    }

    # Deny access to sensitive folders explicitly if root wasn't public (safety net)
    location ~ ^/(app|docker|docs|routes|src|temp_debug)/ {
        deny all;
    }
}
