version: '3.8'

services:
  kaiarasa:
    image: ghcr.io/kaiarasa/kaiarasa:${VERSION:-latest}
    container_name: ${CONTAINER_NAME:-kaiarasa}
    restart: unless-stopped
    ports:
      - "${HOST_IP:-0.0.0.0}:${APP_PORT:-8085}:80"
    volumes:
      # Database & Sessions
      - ${APP_PATH:-.}/kaiarasa_data:/var/www/html/app/Database
      
      # Custom Logos
      - ${APP_PATH:-.}/kaiarasa_logos:/var/www/html/public/assets/img/logos
      
      # Environment file (Optional - mapped from host)
      # - ${APP_PATH:-.}/.env:/var/www/html/.env
      
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - TZ=${TZ:-Asia/Jakarta}
      
    deploy:
      resources:
        limits:
          cpus: '${CPUS:-1.0}'
          memory: ${MEMORY_LIMIT:-512M}

    networks:
      - kaiarasa_net

networks:
  kaiarasa_net:
    driver: bridge
